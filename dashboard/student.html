<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Detail — MoodleLens</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#0B0D10;--card:#14171B;--line:#26292D;--txt:#E8EAED;--mut:#9AA3AF;--accent:#35D0C0;}
    *{box-sizing:border-box;font-family:ui-monospace,'SF Mono',Consolas,monospace}
    body { background:var(--bg); color:var(--txt); margin:0; padding:24px; font-size:13px; }
    h1 { color:var(--accent); font-size:1.2rem; margin-bottom:4px; }
    h2 { color:var(--mut); font-size:.85rem; text-transform:uppercase; letter-spacing:1px; margin-top:28px; margin-bottom:12px; }
    .back { color:var(--mut); font-size:0.85rem; text-decoration:none; display:inline-block; margin-bottom:20px; }
    .back:hover { color:var(--accent); }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    th { background:var(--card); color:var(--mut); text-align:left; padding:10px 14px; text-transform:uppercase; font-size:.7rem; letter-spacing:.5px; border:1px solid var(--line); }
    td { padding:10px 14px; border-bottom:1px solid var(--line); }
    tr:hover td { background:var(--card); }
    .empty { color:#5a6068; text-align:center; padding:40px; }
    canvas { max-height:260px; margin-bottom:32px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← back_to_dashboard</a>
  <h1 id="student-name">Loading...</h1>
  <p id="student-meta" style="color:var(--mut);font-size:0.85rem;margin-bottom:24px;"></p>

  <h2>Weekly Engagement</h2>
  <canvas id="c-weekly"></canvas>

  <h2>Full Activity History</h2>
  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Action</th>
        <th title="What type of Moodle feature was used">Component</th>
        <th title="What exactly was accessed within that feature">Target</th>
      </tr>
    </thead>
    <tbody id="activity-rows"></tbody>
  </table>

  <script>
    const API = "/api";
    const params = new URLSearchParams(window.location.search);
    const sid = params.get("sid");
    const name = params.get("name") || "Student";

    document.getElementById("student-name").textContent = name;

    fetch(`${API}/student/${sid}`)
      .then(r => r.json())
      .then(rows => {
        document.getElementById("student-meta").textContent =
          `${rows.length} activity records found`;
        const tb = document.getElementById("activity-rows");
        if (!rows.length) {
          tb.innerHTML = `<tr><td colspan="4" class="empty">No activity recorded for this student.</td></tr>`;
          return;
        }

        const componentNames = {
  mod_page:"Lecture Page", mod_forum:"Discussion Forum", mod_url:"External Link",
  mod_assign:"Assignment", mod_quiz:"Quiz", gradereport_user:"Grade Report", core:"General Course Activity"
};
const targetNames = {
  course_module:"This specific resource", course:"Course homepage (overview)", grade_report:"Their own grades",
  feedback:"Checked feedback", assessable:"Assignment submission"
};
tb.innerHTML = rows.map(r => `
          <tr>
            <td>${r.time}</td>
            <td>${r.action}</td>
            <td>${componentNames[r.component] || r.component}</td>
            <td>${targetNames[r.target] || r.target || "—"}</td>
          </tr>
        `).join("");

        // Sequential weeks counted from this student's first activity record,
        // with zero-activity weeks kept in the sequence as zero bars.
        const MS_PER_WEEK = 7 * 24 * 60 * 60 * 1000;
        const times = rows.map(r => new Date(r.time).getTime());
        const firstTime = times.reduce((a, b) => Math.min(a, b));
        const lastTime = times.reduce((a, b) => Math.max(a, b));
        const weekOf = t => Math.floor((t - firstTime) / MS_PER_WEEK) + 1;
        const weekCounts = new Array(weekOf(lastTime)).fill(0);
        times.forEach(t => { weekCounts[weekOf(t) - 1] += 1; });
        // Plugin-free data labels: draw each bar's value above it on the canvas.
        const barValueLabels = {
          id: "barValueLabels",
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            const meta = chart.getDatasetMeta(0);
            ctx.save();
            ctx.font = "10px ui-monospace,'SF Mono',Consolas,monospace";
            ctx.fillStyle = "#9AA3AF";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            chart.data.datasets[0].data.forEach((value, i) => {
              const bar = meta.data[i];
              if (bar) ctx.fillText(String(value), bar.x, bar.y - 4);
            });
            ctx.restore();
          }
        };
        new Chart(document.getElementById("c-weekly"), {
          type: "bar",
          data: {
            labels: weekCounts.map((_, i) => "Week " + (i + 1)),
            datasets: [{
              label: "Events",
              data: weekCounts,
              backgroundColor: "#35D0C0",
              borderRadius: 3
            }]
          },
          options: {
            maintainAspectRatio: false,
            layout: { padding: { top: 16 } },
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false } },
              y: { beginAtZero: true, grid: { color: "#26292D" } }
            }
          },
          plugins: [barValueLabels]
        });
      })
      .catch(() => {
        document.getElementById("activity-rows").innerHTML =
          `<tr><td colspan="4" class="empty">Could not load activity data.</td></tr>`;
      });
  </script>
</body>
</html>
